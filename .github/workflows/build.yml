name: Build and Release APK + Web

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # 版本以 package.json 的 packageManager（pnpm@11.21.0）为唯一来源：
        # 这里再写 version 会触发 "Multiple versions of pnpm specified"。

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # ========== Web build ==========
      - name: Build web dist
        run: pnpm build

      - name: Package dist.zip
        run: cd dist && zip -r ../dist.zip . && cd ..

      - name: Upload web dist (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          if-no-files-found: error

      - name: Build web + push to Android assets
        run: pnpm build:android

      - name: Upload web dist (android)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-android
          path: dist/
          if-no-files-found: error

      # ========== Android build ==========
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: platform/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: platform/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ========== Release ==========
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ADOJAS ${{ github.ref_name }}
          body: |
            ADOJAS ${{ github.ref_name }} 自动构建

            下载 `dist.zip` 为 Web 版本。
            下载 `app-debug.apk` 为 Android APK。
          files: |
            dist.zip
            platform/android/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
